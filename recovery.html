<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>成长更新中</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0a1a, #0f0f23, #1a0a2e);
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 340px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(100,255,218,0.12);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      backdrop-filter: blur(16px);
    }
    .icon { font-size: 52px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin-bottom: 10px; }
    p { font-size: 13px; color: #8892b0; line-height: 1.6; margin-bottom: 18px; }
    button {
      border: none;
      background: linear-gradient(135deg, #64ffda, #00d4ff);
      color: #0a0a1a;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64ffda;
      margin-right: 6px;
      animation: pulse 1.2s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🧬</div>
    <h1>成长正在更新</h1>
    <p id="status"><span class="dot"></span>正在检查新版本，请稍候...</p>
    <button id="retry" style="display:none" onclick="location.reload()">重新检查</button>
  </div>
  <script>
    (function() {
      var status = document.getElementById('status');
      var retry = document.getElementById('retry');
      function done() {
        status.innerHTML = '更新完成，正在打开应用...';
        setTimeout(function() { location.href = './'; }, 800);
      }
      function fail() {
        status.textContent = '暂时无法连接，请检查网络后点击重试';
        retry.style.display = 'block';
      }
      if (!('serviceWorker' in navigator)) {
        location.href = './';
        return;
      }
      var timer = setTimeout(fail, 20000);
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        return Promise.all(regs.map(function(reg) { return reg.update(); }));
      }).then(function() {
        clearTimeout(timer);
        done();
      }).catch(function() {
        clearTimeout(timer);
        fail();
      });
    })();
  </script>
</body>
</html>
